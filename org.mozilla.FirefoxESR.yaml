app-id: org.mozilla.FirefoxESR
default-branch: unofficial
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.mozilla.firefox.BaseApp
base-version: '25.08'
command: firefox-esr
add-extensions:
  org.mozilla.FirefoxESR.systemconfig:
    directory: etc/firefox
    no-autodownload: true

finish-args:
  - --allow=devel

  - --device=all

  - --share=ipc
  - --share=network

  - --socket=pcsc
  - --socket=cups
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland

  - --env=DICPATH=/usr/share/hunspell
  - --env=MOZ_APP_REMOTINGNAME=org.mozilla.FirefoxESR

  - --require-version=0.11.1

  - --filesystem=xdg-config/gtk-3.0:ro
  - --filesystem=xdg-download
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --filesystem=xdg-run/speech-dispatcher:ro

  - --persist=.mozilla

  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.a11y.Bus
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gtk.vfs.*

  - --system-talk-name=org.freedesktop.NetworkManager

  - --own-name=org.mozilla.firefox.*
  - --own-name=org.mpris.MediaPlayer2.firefox.*
  - --own-name=org.mozilla.firefox_esr.*

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/etc/firefox

modules:
  - name: search-provider
    buildsystem: simple
    build-commands:
      - install -Dm644 org.mozilla.FirefoxESR.search-provider.ini ${FLATPAK_DEST}/share/gnome-shell/search-providers/${FLATPAK_ID}-search-provider.ini
      - install -Dm644 org.mozilla.FirefoxESR.SearchProvider.service ${FLATPAK_DEST}/share/dbus-1/services/${FLATPAK_ID}.SearchProvider.service
    sources:
      - type: file
        path: files/org.mozilla.FirefoxESR.search-provider.ini
      - type: file
        path: files/org.mozilla.FirefoxESR.SearchProvider.service

  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 org.mozilla.FirefoxESR.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
    sources:
      - type: file
        path: files/org.mozilla.FirefoxESR.desktop

  - name: launch-script
    buildsystem: simple
    build-commands:
      - install -Dm755 launch-script.sh ${FLATPAK_DEST}/bin/firefox-esr
    sources:
      - type: script
        dest-filename: launch-script.sh
        # https://hg.mozilla.org/mozilla-central/raw-file/33f0079fba2d08c293f0a63890fa88c78e2550ec/taskcluster/docker/firefox-flatpak/launch-script.sh
        commands:
          - export TMPDIR=$XDG_CACHE_HOME/tmp
          - >
            exec /app/lib/firefox/firefox
            --name org.mozilla.FirefoxESR
            --class org.mozilla.FirefoxESR
            "$@"

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 org.mozilla.FirefoxESR.appdata.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: files/org.mozilla.FirefoxESR.appdata.xml

  - name: icons
    buildsystem: simple
    build-commands:
      - install -Dm644 "Fx-Browser-icon-fullColor.svg" "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg"
      - install -Dm644 "Fx-Browser-icon-oneColor-white.svg" "${FLATPAK_DEST}/share/icons/hicolor/symbolic/apps/${FLATPAK_ID}-symbolic.svg"
    sources:
      - type: file
        path: files/Fx-Browser-icon-fullColor.svg
      - type: file
        path: files/Fx-Browser-icon-oneColor-white.svg

  - name: distribution
    buildsystem: simple
    build-commands:
      - install -Dm644 distribution.ini ${FLATPAK_DEST}/lib/firefox/distribution/distribution.ini
    sources:
      - type: file
        path: files/distribution.ini

  - name: firefox-esr
    buildsystem: simple
    build-commands:
      - find . -name '*.py' -type f -exec sed -i -e 's,!/usr/bin/python,!/usr/bin/python3,'
        -e 's,/usr/bin/env python,/usr/bin/env python3,' -s {} \;

      - cp -rf . ${FLATPAK_DEST}/lib/firefox
      - rm -f ${FLATPAK_DEST}/lib/firefox/firefox-config
      - rm -f ${FLATPAK_DEST}/lib/firefox/update-settings.ini
    sources:
      - generated/firefox_esr.json

  - name: lang-packs
    buildsystem: simple
    build-commands:
      - mkdir -p /app/firefox/distribution/extensions
      # https://github.com/flathub/org.mozilla.Thunderbird/blob/22e4c5bfffa1a28507a0009c3c84c4f17d69c262/org.mozilla.Thunderbird.json#L244
      - for lang in langpacks/*.xpi;do export locale=$(basename -s .xpi $lang); install -Dm644 -t /app/share/runtime/locale/${locale:9:2}/ $lang; ln -sf /app/share/runtime/locale/${locale:9:2}/$(basename $lang) /app/firefox/distribution/extensions/$(basename $lang); done
    sources:
      - generated/langpacks.json
